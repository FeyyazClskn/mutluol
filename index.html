<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bugünlük Kaçış</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--ink:#e8e4d8;--mute:#8d93a3;--amber:#f2b45a;--line:rgba(232,228,216,.16);--card:#0f1524;--ui:'Manrope',system-ui,sans-serif;--hand:'Caveat','Segoe Script',cursive;--top:calc(14px + env(safe-area-inset-top,0px));--bot:calc(14px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#070b14;color:var(--ink);font:400 15px/1.5 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#stage{position:fixed;inset:0;overflow:auto;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
#room{display:block;height:100%;width:max(100vw,177.78vh);transition:filter 2.6s ease;--lamp:1;--rs:1}
body.dark #room{filter:brightness(.1) saturate(.5)}
.l1{transform:translate(calc(var(--px,0)*-3px),calc(var(--py,0)*-2px));transition:transform .6s ease-out}
.l2{transform:translate(calc(var(--px,0)*-7px),calc(var(--py,0)*-4px));transition:transform .6s ease-out}
.l3{transform:translate(calc(var(--px,0)*-12px),calc(var(--py,0)*-6px));transition:transform .6s ease-out}
.obj{cursor:pointer;outline:none;transition:filter .3s}
.obj:hover,.obj:focus-visible{filter:brightness(1.22) drop-shadow(0 0 7px rgba(242,180,90,.55))}
.lampglow{opacity:var(--lamp);transition:opacity .6s;pointer-events:none}
.flag{transform-box:fill-box;transform-origin:left center;animation:wave 5s ease-in-out infinite}
.flag:nth-of-type(2){animation-delay:-1.7s}.flag:nth-of-type(3){animation-delay:-3.2s}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(1.8deg) scaleX(.984)}}
.rd{animation:fall linear infinite;animation-duration:calc(var(--d)*var(--rs))}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(350px)}}
body.norain .rd{display:none}
.steam{animation:steam 4s ease-in-out infinite;transform-box:fill-box}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.5}100%{opacity:0;transform:translateY(-18px)}}
body:not(.dark) .scr{animation:on 2.4s 1.2s ease-out both}
body:not(.dark) .pscr{animation:blink 9s 4s ease-in-out infinite}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,70%,100%{opacity:.08}74%,84%{opacity:.9}}
/* HUD */
#clock{position:fixed;left:16px;top:var(--top);pointer-events:none;text-shadow:0 1px 8px #000}
#ct{font-size:28px;font-weight:300;letter-spacing:.02em;display:block}
#cd{font-size:12px;color:var(--mute)}#cq{display:block;font-size:12px;color:var(--amber);opacity:.85;margin-top:2px}
#count{position:fixed;right:16px;top:var(--top);font-size:12px;color:var(--mute);padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:rgba(7,11,20,.5);backdrop-filter:blur(6px)}
#ctrl{position:fixed;left:12px;bottom:var(--bot);display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px)}
#ctrl button{background:rgba(7,11,20,.55);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--mute);backdrop-filter:blur(6px)}
#ctrl button[aria-pressed=true]{color:var(--ink);border-color:rgba(242,180,90,.5)}
#vol{width:84px;accent-color:var(--amber)}
#hint{position:fixed;left:50%;bottom:calc(var(--bot) + 40px);transform:translateX(-50%);font-size:13px;color:var(--mute);transition:opacity 1.5s;pointer-events:none;text-align:center;width:90%}
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 8px);transform:translate(-50%,20px);opacity:0;background:rgba(15,21,36,.94);border:1px solid var(--line);border-radius:10px;padding:10px 16px;max-width:88vw;text-align:center;transition:.4s;pointer-events:none;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tip{position:fixed;z-index:20;pointer-events:none;background:rgba(15,21,36,.92);border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .2s;max-width:240px}
#tip.on{opacity:1}
/* intro */
#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;background:radial-gradient(#0b1220,#04070d);transition:opacity 2s;padding:24px}
#intro.out{opacity:0;pointer-events:none}
#intro p{margin:.3em 0;font-weight:300;font-size:clamp(20px,3.4vw,34px);opacity:0;animation:on 2.4s ease forwards}
#intro .a{animation-delay:1.2s}#intro .b{animation-delay:3.4s;color:var(--mute);font-size:clamp(16px,2.2vw,22px)}
#go{margin-top:34px;background:none;border:1px solid var(--line);border-radius:99px;padding:9px 26px;font-size:14px;letter-spacing:.06em;opacity:0;animation:on 1.6s 5.4s ease forwards;transition:border-color .3s}
#go:hover{border-color:var(--amber)}
/* panel */
#panel{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(4,7,13,.62);backdrop-filter:blur(5px);opacity:0;transition:opacity .35s;padding:16px}
#panel.on{opacity:1}#panel[hidden]{display:none}
#card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;max-height:92vh;overflow:auto;max-width:96vw;transform:translateY(14px) scale(.96);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
#panel.on #card{transform:none}
#x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:18px;color:var(--mute);z-index:2}
#card h3{margin:0 0 12px;font-weight:600;font-size:15px}
.lap{position:relative;width:min(92vw,640px);padding:14px 14px 10px;background:linear-gradient(#262d40,#181d2b);border:1px solid #3a4256;border-radius:16px 16px 6px 6px;margin-bottom:18px}
.lap::before{content:'';position:absolute;left:50%;top:5px;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:#3a4256}
.lap::after{content:'';position:absolute;left:-3%;right:-3%;bottom:-14px;height:12px;background:linear-gradient(#4a5266,#20263a);border-radius:0 0 18px 18px}
.lap .bar{display:flex;justify-content:space-between;font-size:11px;color:#c9cbd4;padding:3px 10px;background:rgba(0,0,0,.45);border-radius:5px 5px 0 0}
#scr{min-height:310px;background:radial-gradient(circle at 78% 18%,rgba(255,226,174,.32),transparent 30%),linear-gradient(170deg,#16203a,#1f2442 55%,#3a2c3c);border-radius:0 0 6px 6px;padding:16px;font-size:14px}
.ic{display:inline-flex;flex-direction:column;align-items:center;gap:6px;width:76px;margin:6px;background:none;border:0;font-size:12px}
.ic i{width:44px;height:44px;border-radius:11px;background:rgba(232,228,216,.1);display:grid;place-items:center;font-style:normal;font-size:18px}
.ic:hover i{background:rgba(242,180,90,.22)}.ic i{box-shadow:0 4px 12px #0006;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.bk{background:none;border:0;color:var(--mute);font-size:12px;padding:0 0 10px}
.big{font-size:22px;font-weight:300;line-height:1.4}
.plr{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0}
.plr button,.chd button{background:rgba(232,228,216,.08);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.plr button:hover,.chd button:hover{border-color:var(--amber)}
.ph{width:min(86vw,320px);height:min(76vh,560px);border:6px solid #222a3a;border-radius:30px;background:linear-gradient(170deg,#18243c,#0d1220);padding:18px 14px;display:flex;flex-direction:column;overflow:auto}
.ph .t{font-size:44px;font-weight:300;text-align:center;margin-top:60px}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;margin:5px 0;font-size:13px}
.msg.me{align-self:flex-end;background:#2c4a7a}.msg.them{background:#252c3c}
.ph .col{display:flex;flex-direction:column}
.nb{width:min(90vw,380px);perspective:1200px}
.pg{min-height:340px;padding:34px 26px 26px 44px;background:repeating-linear-gradient(#efe6d2 0 31px,#d9cdb2 31px 32px);color:#2b2a35;border-radius:4px 10px 10px 4px;box-shadow:inset 22px 0 18px -14px rgba(0,0,0,.35),0 8px 30px #0008;font:500 28px/32px var(--hand);transform-origin:left center;transition:transform .28s ease-in;display:flex;align-items:center}
.nn{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--mute)}
.nn button{background:none;border:1px solid var(--line);border-radius:99px;width:38px;height:32px}
.gt{width:min(94vw,780px)}
#gsv{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.idle{animation:idle 6s ease-in-out infinite}@keyframes idle{50%{transform:translateY(5px)}}
.gs{cursor:pointer;outline:none}.sl{stroke:#ddd5bd;transition:stroke .2s}.gs:hover .sl,.gs:focus-visible .sl{stroke:#f2b45a}
.gs text{fill:#8d93a3;font:11px var(--ui)}
.sl.v{animation:svib .5s ease-out}@keyframes svib{0%{transform:translateY(-3px)}25%{transform:translateY(3px)}50%{transform:translateY(-2px)}75%{transform:translateY(1px)}100%{transform:none}}
#rh.st{animation:strum .35s ease-out}@keyframes strum{40%{transform:translateY(-26px)}}
.chd{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.sm{color:var(--mute);font-size:12px}
.scrap{margin-top:16px;background:none;border:1px dashed var(--line);border-radius:6px;color:var(--mute);padding:4px 10px;font-size:12px}
.paper{background:#efe6d2;color:#2b2a35;padding:22px;font:500 26px/1.2 var(--hand);border-radius:3px;transform:rotate(-1.5deg);margin-top:14px;max-width:320px}
@media(max-width:700px){#cq{display:none}#hint{bottom:calc(var(--bot) + 44px)}}
@media(prefers-reduced-motion:reduce){.flag,.rd,.steam{animation:none}.l1,.l2,.l3{transition:none}}
</style>
</head>

<div id="intro"><div><p class="a">Bugün hiçbir şeyi çözmek zorunda değilsin.</p><p class="b">Sadece biraz burada takıl.</p><button id="go" aria-label="Odaya gir">İçeri Gir</button></div></div>

<script>
/* ============ VERİLER — buradan kolayca değiştirebilirsin ============ */
const DATA={
notebook:["Bugün de fena değilsin.", "Sanıldığından daha eğlenceli bir insansın.", "Bazı insanların enerjisi ortamı değiştiriyor. Seninki genelde iyi yönde.", "Uyku düzenin bir şaka gibi. Ama en azından tutarlı bir şaka.", "Zor günlerde bile insanı rahatlatan bir tarafın var. Fark etmiyorsun ama var.", "İnsanı yormayan nadir insanlardansın.", "Bugün moralin kötüyse sorun değil. Yarın yine saçma sapan konuşuruz.", "Sana güvenen biri olduğunu unutma. Bir tane bile yeter.", "Yeteneklerin çok. Sadece hangisini ne zaman kullanacağını bazen unutuyorsun.", "Bugünlük hesap kapandı."],
daily:["Bugünlük yeter.","Yarın devam edersin.","Acelen yok.","Bugün idare etmek yeterli.","Sırada bekleyen bir şey yok."],
tips:{window:"Hâlâ yağıyor.",flowers:"Solmamış. İyi işaret.",lamp:"Tek bir ışık yeter.",laptop:"Uyku modunda ama seni bekliyor.",phone:"Sessizde. Bilerek.",notebook:"Kapağı biraz yıpranmış. İyi işaret.",pen:"Bununla ne yazılacağı konusunda hiçbir fikrimiz yok.",mug:"Hâlâ sıcak.",guitar:"Akort konusunda iddialı değil."},
small:{mug:["Hâlâ sıcak. Nasıl olduğunu sorma.","Üçüncü kahve değil. İkinci buçuk."],pen:["Yazmak zorunda değilsin. Tutmak yeterli.","Mürekkebi bitmiş olabilir. Sorun değil."]},
phone:{msgs:[["me","Bugün insan görmek istemiyorum."],["them","Anlaşıldı. İnsanlar geçici olarak devre dışı bırakıldı."],["me","Peki ya sen?"],["them","Sen istisnasın. Şimdilik."]],
notes:["Her şey mutlu ol diye.","Yorgunsan dinlen. Bunu hak ettin, tartışmaya açık değil.","Moralin kötüyken bile yanında olunası biri olmayı başarıyorsun.","Çok da kötü değilsin, kabul edelim."],lock:["1 yeni bildirim: “Hâlâ buradayız.”","Bugün için hiçbir görev yok.","Batarya %64. Sen de öyle."],
weather:["12°C","Yağmurlu","Dışarı çıkmak isteği: %4"]},
laptop:{today:["Bugünün resmi amacı:","Gereksiz yere kendini yormamak."],notes:["Ortama girdiğinde oda biraz daha şenleniyor. Kimse söylemez ama öyle.","Kendine yüklenme. Zaten iyi idare edenlerdensin.","Espri anlayışın sağlam. Bu not resmi kayıtlara geçti.","Zor günlerde bile insanı rahatlatan tarafın var. Fark etmiyorsun ama var."],secret:["Gizli klasör açıldı.","İçinde yalnızca bir dosya var:","“gerekirse_ara.txt” — Gerekirse ararsın."]},
tracks:[{t:"Acem Kızı",src:"assets/audio/track1.mp3"},{t:"Sevdiğin diğer şarkılar...",src:"assets/audio/track2.mp3"}],
chords:{C:[null,3,2,0,1,0],Am:[null,0,2,2,1,0],F:[1,3,3,2,1,1],G:[3,2,0,0,0,3],Em:[0,2,2,0,0,0]},
flowernote:["Bu çiçekleri masa boş kalmasın diye koyduk.","Tamam, biraz da sen gülümse diye."],flags:{turk:"türk.png",ataturk:"atatürk.png",gokturk:"göktürk.png"},guitarnote:["Gitar çalmayı sakın bırakma Türkçü güzeli :)"],
final:["Buradaki her şeyi kurcaladın.","Demek ki biraz oyalanmayı başardık.","Bugünlük görev tamamlandı.","Gerisini yarına bırakabilirsin."],
items:["laptop","phone","notebook","guitar","lamp","window","mug","pen","flowers","guitarnote","secret","lock"]};
const OPEN=[40,45,50,55,59,64],NAMES=["E","A","D","G","B","E"],KEYS="asdfgh";

/* ============ yardımcılar / depolama ============ */
const $=s=>document.querySelector(s),pick=a=>a[Math.random()*a.length|0],room=$('#room');
const S={get(k,d){try{const v=localStorage.getItem('bk_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('bk_'+k,JSON.stringify(v))}catch(e){}}};
let ambOn=S.get('audioEnabled',true),musOn=S.get('musicEnabled',true),vol=S.get('volume',.6),rainOn=S.get('rain',true),mode=null,ctx,master,ambG,found=new Set(S.get('discoveredItems',[]));
const TOTAL=DATA.items.length;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ============ ses ============ */
const AUD=new Audio();AUD.preload='none';let ti=0;
function ac(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();master=ctx.createGain();master.connect(ctx.destination);ambG=ctx.createGain();ambG.connect(master);ambience();apply()}
if(ctx.state==='suspended')ctx.resume();return ctx}
function noise(kind){const n=ctx.sampleRate*4,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(kind){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}const s=ctx.createBufferSource();s.buffer=b;s.loop=true;s.start();return s}
function ambience(){const r=noise(0),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.frequency.value=3200;f.Q.value=.4;g.gain.value=.09;r.connect(f).connect(g).connect(ambG);
const h=noise(1),lf=ctx.createBiquadFilter(),g2=ctx.createGain();lf.type='lowpass';lf.frequency.value=260;g2.gain.value=.5;h.connect(lf).connect(g2).connect(ambG)}
function apply(){if(master)master.gain.value=vol;if(ambG)ambG.gain.setTargetAtTime(ambOn?1:0,ctx.currentTime,.4);AUD.volume=vol;AUD.muted=!musOn;
$('#bA').setAttribute('aria-pressed',ambOn);$('#bM').setAttribute('aria-pressed',musOn);$('#bR').setAttribute('aria-pressed',rainOn);$('#vol').value=vol;document.body.classList.toggle('norain',!rainOn)}
function pluck(f,when=0){if(!ac())return;const sr=ctx.sampleRate,n=sr*2,N=Math.round(sr/f),b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0);
for(let i=0;i<N;i++)d[i]=Math.random()*2-1;for(let i=N;i<n;i++)d[i]=.4985*(d[i-N]+d[i-N+1]);
const s=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=.55;s.buffer=b;s.connect(g).connect(master);s.start(ctx.currentTime+when)}
$('#bA').onclick=()=>{ac();ambOn=!ambOn;S.set('audioEnabled',ambOn);apply()};
$('#bM').onclick=()=>{musOn=!musOn;S.set('musicEnabled',musOn);apply()};
$('#bR').onclick=()=>{rainOn=!rainOn;S.set('rain',rainOn);apply()};
$('#vol').oninput=e=>{vol=+e.target.value;S.set('volume',vol);apply()};

/* ============ arayüz ============ */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
function cnt(){$('#count').textContent=found.size+' / '+TOTAL+' keşfedildi'}
function disc(id){if(found.has(id))return;found.add(id);S.set('discoveredItems',[...found]);cnt();toast('Yeni bir şey keşfettin.');if(found.size===TOTAL)setTimeout(finale,2600)}
let last;
function openP(html,after){last=document.activeElement;$('#body').innerHTML=html;const p=$('#panel');p.hidden=false;requestAnimationFrame(()=>p.classList.add('on'));$('#x').focus();after&&after($('#body'))}
function closeP(){mode=null;const p=$('#panel');p.classList.remove('on');setTimeout(()=>{p.hidden=true},300);last&&last.focus&&last.focus()}
$('#x').onclick=closeP;$('#panel').addEventListener('pointerdown',e=>{if(e.target.id==='panel')closeP()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#panel').hidden)closeP();
if(mode==='gt'&&!e.repeat&&!e.ctrlKey&&!e.metaKey){const i=KEYS.indexOf(e.key.toLowerCase());if(i>=0){e.preventDefault();string(i)}}
if(mode==='gt'&&e.target.dataset&&e.target.dataset.s!==undefined&&(e.key==='Enter'||e.key===' ')){e.preventDefault();string(+e.target.dataset.s)}
if(mode==='nb'){if(e.key==='ArrowRight')flip(1);if(e.key==='ArrowLeft')flip(-1)}});
function finale(){openP('<div style="max-width:340px" class="big">'+DATA.final.map(l=>'<p>'+esc(l)+'</p>').join('')+'</div>')}

/* ============ laptop ============ */
function openLaptop(){disc('laptop');openP('<div class="lap"><div class="bar"><span>Bugünlük</span><span id="lc"></span></div><div id="scr"></div></div>',()=>{lap('desk');$('#lc').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})})}
function lap(v){const s=$('#scr'),L=DATA.laptop,bk='<button class="bk" data-v="desk">← Masaüstü</button>';let h='';
if(v==='desk'){h=[['music','♪','Müzik'],['notes','✎','Notlar'],['today','☀','Bugün'],['secret',found.size>=6||found.has('secret')?'◈':'🔒','Gizli']].map(a=>'<button class="ic" data-v="'+a[0]+'"><i>'+a[1]+'</i>'+a[2]+'</button>').join('')}
else if(v==='today'){h=bk+'<div class="big">'+L.today.map(esc).join('<br>')+'</div><p class="sm">'+new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'})+'</p>'}
else if(v==='notes'){h=bk+L.notes.map(x=>'<p>'+esc(x)+'</p>').join('')}
else if(v==='secret'){if(found.size>=6||found.has('secret')){disc('secret');h=bk+L.secret.map(x=>'<p>'+esc(x)+'</p>').join('')}else h=bk+'<p>Kilitli.</p><p class="sm">Odada biraz daha dolaşınca açılır.</p>'}
else if(v==='music'){h=bk+'<div class="big" id="tn"></div><div class="sm" id="ts"></div><div class="plr"><button data-m="p" aria-label="Önceki">⏮</button><button data-m="t" aria-label="Oynat / Duraklat" id="pp">▶</button><button data-m="n" aria-label="Sonraki">⏭</button><button data-m="m" aria-label="Sesi kapat / aç" id="mm"></button></div><div class="sm">Senin sesin ve yeteneğin kadar güzel olmasa da bunlar da güzel şarkılar.</div>';setTimeout(mus,0)}
s.innerHTML=h}
function mus(){const T=DATA.tracks[ti];$('#tn').textContent=T.t;$('#pp').textContent=AUD.paused?'▶':'❚❚';$('#mm').textContent=musOn?'🔊':'🔇'}
function track(d){ti=(ti+d+DATA.tracks.length)%DATA.tracks.length;AUD.src=DATA.tracks[ti].src;AUD.play().catch(()=>{});mus()}
AUD.onerror=()=>{const s=$('#ts');if(s)s.textContent='Dosya bulunamadı: '+DATA.tracks[ti].src};AUD.onended=()=>track(1);
$('#body').addEventListener('click',e=>{const b=e.target.closest('[data-v],[data-m],[data-c],[data-a]');if(!b)return;const d=b.dataset;
if(d.v){if(d.v==='music')ac();b.closest('.lap')?lap(d.v):phn(d.v)}
if(d.m){ac();if(d.m==='t'){if(!AUD.src)track(0);else AUD.paused?AUD.play():AUD.pause();setTimeout(mus,80)}if(d.m==='n')track(1);if(d.m==='p')track(-1);if(d.m==='m'){musOn=!musOn;S.set('musicEnabled',musOn);apply();mus()}}
if(d.c)chord(d.c);if(d.a==='lock')phn('home');if(d.a==='scrap'){disc('guitarnote');b.outerHTML='<div class="paper">'+DATA.guitarnote.map(esc).join('<br>')+'</div>'}});
AUD.addEventListener('play',()=>{const p=$('#pp');if(p)p.textContent='❚❚'});AUD.addEventListener('pause',()=>{const p=$('#pp');if(p)p.textContent='▶'});

/* ============ telefon ============ */
function openPhone(){disc('phone');openP('<div class="ph" id="phs"></div>',()=>phn('lock'))}
function phn(v){const s=$('#phs'),P=DATA.phone,bk='<button class="bk" data-v="home">← Ana ekran</button>';let h='';
if(v==='lock')h='<button class="col" data-a="lock" style="background:none;border:0;flex:1" aria-label="Kilidi aç"><div class="t">'+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+'</div><p class="sm" style="text-align:center;margin-top:30px">'+esc(pick(P.lock))+'</p></button>';
else if(v==='home'){disc('lock');h='<div style="margin-top:40px">'+[['msgs','✉','Mesajlar'],['notes','✎','Notlar'],['weather','☂','Hava']].map(a=>'<button class="ic" data-v="'+a[0]+'"><i>'+a[1]+'</i>'+a[2]+'</button>').join('')+'</div>'}
else if(v==='msgs')h=bk+'<div class="col">'+P.msgs.map(m=>'<div class="msg '+m[0]+'">'+esc(m[1])+'</div>').join('')+'</div>';
else if(v==='notes')h=bk+P.notes.map(x=>'<p>• '+esc(x)+'</p>').join('');
else if(v==='weather')h=bk+'<div class="t" style="margin-top:30px">'+P.weather[0]+'</div><p style="text-align:center">'+P.weather[1]+'</p><p class="sm" style="text-align:center">'+P.weather[2]+'</p>';
s.innerHTML=h}

/* ============ defter ============ */
let pg=S.get('notebookPage',0);
function openNb(){disc('notebook');pg=Math.random()*DATA.notebook.length|0;mode='nb';openP('<div class="nb"><div class="pg" id="pg"></div><div class="nn"><button data-n="-1" aria-label="Önceki sayfa">‹</button><span id="pn"></span><button data-n="1" aria-label="Sonraki sayfa">›</button></div></div>',b=>{sh();b.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>flip(+x.dataset.n))})}
function sh(){$('#pg').textContent=DATA.notebook[pg];$('#pn').textContent=(pg+1)+' / '+DATA.notebook.length;S.set('notebookPage',pg)}
function flip(d){const p=$('#pg');if(!p)return;p.style.transform='rotateY(-88deg)';setTimeout(()=>{pg=(pg+d+DATA.notebook.length)%DATA.notebook.length;sh();p.style.transition='none';p.style.transform='rotateY(70deg)';p.offsetWidth;p.style.transition='';p.style.transform='none'},280)}

/* ============ gitar (elde tutulan) ============ */
const FR=n=>80+620*(1-Math.pow(2,-n/12)),SY=(i,x)=>{const t=(x-80)/620,a=192.5+i*7,b=175+i*14;return a+t*(b-a)};
function openGt(){disc('guitar');mode='gt';let f='',s='',dk='';
for(let n=1;n<=12;n++){const x=FR(n),h=25+(x-80)*.0547;f+=`<line x1="${x.toFixed(1)}" y1="${(210-h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(210+h).toFixed(1)}" stroke="#9a927e" stroke-width="1.6" opacity=".65"/>`}
for(let i=0;i<6;i++){const a=SY(i,80).toFixed(1),b=SY(i,700).toFixed(1);s+=`<g class="gs" data-s="${i}" tabindex="0" role="button" aria-label="${NAMES[i]} teli, ${KEYS[i].toUpperCase()} tuşu"><line x1="80" y1="${a}" x2="700" y2="${b}" stroke="transparent" stroke-width="12"/><line class="sl" x1="80" y1="${a}" x2="700" y2="${b}" stroke-width="${(2.6-i*.3).toFixed(1)}"/><text x="790" y="${(+b+4).toFixed(1)}">${NAMES[i]} · ${KEYS[i].toUpperCase()}</text></g>`}
for(let k=0;k<3;k++)dk+=`<circle cx="${42+k*14}" cy="194" r="3.5"/><circle cx="${42+k*14}" cy="226" r="3.5"/>`;
openP(`<div class="gt"><svg id="gsv" viewBox="0 0 900 480" role="group" aria-label="Elde tutulan gitar"><defs><radialGradient id="gw" cx=".4" cy=".4"><stop offset="0" stop-color="#c47f3d"/><stop offset="1" stop-color="#7a4a22"/></radialGradient></defs><g class="idle"><g transform="rotate(12 450 230)">
<g fill="#4d2e16"><circle cx="520" cy="210" r="97"/><circle cx="650" cy="210" r="125"/></g><g fill="url(#gw)"><circle cx="520" cy="210" r="92"/><circle cx="650" cy="210" r="120"/></g>
<circle cx="565" cy="210" r="38" fill="#120b07" stroke="#2a1a10" stroke-width="5"/>
<polygon points="80,185 500,162 500,258 80,235" fill="#2e2018"/><rect x="28" y="186" width="54" height="48" rx="6" fill="#241710"/><g fill="#c9c2b0">${dk}</g><rect x="78" y="184" width="4" height="52" fill="#e8dfc6"/><rect x="696" y="168" width="14" height="84" rx="3" fill="#1f140c"/>
${f}${s}<g id="dots" pointer-events="none"></g>
</g></g></svg><div class="chd">${Object.keys(DATA.chords).map(c=>`<button data-c="${c}">${c}</button>`).join('')}</div><p class="sm">Tellere dokun ya da üzerinden kaydır. Klavyede A S D F G H tuşları da çalışıyor.</p><button class="scrap" data-a="scrap" aria-label="Gitarın arkasındaki kağıt">Arkasında bir kağıt var</button></div>`,()=>{
const sv=$('#gsv');let ls=-1;const hit=e=>{const g=document.elementFromPoint(e.clientX,e.clientY),t=g&&g.closest&&g.closest('.gs');return t?+t.dataset.s:-1};
sv.addEventListener('pointerdown',e=>{ac();ls=hit(e);if(ls>=0)string(ls)});
sv.addEventListener('pointermove',e=>{if(!e.buttons)return;const i=hit(e);if(i>=0&&i!==ls){ls=i;string(i)}});
sv.addEventListener('pointerup',()=>ls=-1)})}
function vib(i){const e=document.querySelectorAll('.sl')[i];if(!e)return;e.classList.remove('v');e.getBoundingClientRect();e.classList.add('v')}
function hand(){const h=$('#rh');if(!h)return;h.classList.remove('st');h.getBoundingClientRect();h.classList.add('st')}
function string(i,w=0){pluck(440*Math.pow(2,(OPEN[i]-69)/12),w);vib(i);hand()}
function dots(c){const d=$('#dots');if(d)d.innerHTML=DATA.chords[c].map((f,i)=>{if(!(f>0))return'';const x=(FR(f-1)+FR(f))/2;return`<circle cx="${x.toFixed(1)}" cy="${SY(i,x).toFixed(1)}" r="6" fill="#f2b45a" opacity=".92"/>`}).join('')}
function chord(c){hand();dots(c);DATA.chords[c].forEach((f,i)=>{if(f!==null){pluck(440*Math.pow(2,(OPEN[i]+f-69)/12),i*.045);setTimeout(()=>vib(i),i*45)}})}

/* ============ nesne etkileşimleri ============ */
let lamp=0,lc=0,wc=0;
const ACT={laptop:openLaptop,phone:openPhone,notebook:openNb,guitar:openGt,
lamp(){lc++;lamp=(lamp+1)%3;room.style.setProperty('--lamp',[1,.5,.15][lamp]);if(lc>=3)disc('lamp')},
window(){wc++;room.style.setProperty('--rs',[1,.45,1.8][wc%3]);if(wc>=3)disc('window')},
mug(){toast(pick(DATA.small.mug));disc('mug')},pen(){toast(pick(DATA.small.pen));disc('pen')},
flowers(){disc('flowers');openP('<h3>Çiçeğin altındaki not</h3><div class="paper">'+DATA.flowernote.map(esc).join('<br>')+'</div>')}};
const tip=$('#tip');
document.querySelectorAll('.obj').forEach(o=>{const id=o.dataset.id,go=()=>{ac();$('#hint').style.opacity=0;ACT[id]()};
o.addEventListener('click',go);o.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
o.addEventListener('pointerenter',e=>{if(e.pointerType==='touch')return;tip.textContent=DATA.tips[id];tip.classList.add('on')});
o.addEventListener('pointermove',e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-250)+'px';tip.style.top=(e.clientY+16)+'px'});
o.addEventListener('pointerleave',()=>tip.classList.remove('on'));
o.addEventListener('focus',()=>{const r=o.getBoundingClientRect();tip.textContent=DATA.tips[id];tip.style.left=Math.max(8,Math.min(r.left,innerWidth-250))+'px';tip.style.top=Math.max(8,r.top-38)+'px';tip.classList.add('on')});
o.addEventListener('blur',()=>tip.classList.remove('on'))});

/* ============ sahne kurulumu ============ */
(function(){const NS='http://www.w3.org/2000/svg',mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const c=$('#city');for(let x=650;x<990;x+=34){const h=70+Math.random()*120;mk('rect',{x,y:420-h,width:32,height:h,fill:'#0c1322'},c);for(let k=0;k<7;k++)if(Math.random()>.55)mk('rect',{x:x+4+(k%3)*9,y:420-h+8+((k/3)|0)*16,width:5,height:6,fill:'#f2b45a',opacity:.6},c)}
const r=$('#rain');for(let i=0;i<46;i++){const x=650+Math.random()*340,l=mk('line',{x1:x,y1:90,x2:x-3,y2:104,class:'rd'},r);l.style.setProperty('--d',(.55+Math.random()*.6)+'s');l.style.animationDelay=-Math.random()+'s'}
document.querySelectorAll('polygon[data-star]').forEach(p=>{const[cx,cy,R]=p.dataset.star.split(',').map(Number),pts=[];for(let i=0;i<10;i++){const a=Math.PI+i*Math.PI/5,q=i%2?R*.4:R;pts.push((cx+q*Math.cos(a)).toFixed(1)+','+(cy+q*Math.sin(a)).toFixed(1))}p.setAttribute('points',pts.join(' '))})})();
function clock(){const d=new Date();$('#ct').textContent=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});$('#cd').textContent=d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});$('#cq').textContent=DATA.daily[Math.floor(d/864e5)%DATA.daily.length]}
clock();setInterval(clock,20000);cnt();apply();
(function(){const g=$('#keys');for(let r=0;r<3;r++){const y=662+r*9,e=(y-657)*42/45,L=300-e+14,R=670+e-14;for(let x=L;x+17<R;x+=20){const k=document.createElementNS('http://www.w3.org/2000/svg','rect');k.setAttribute('x',x.toFixed(1));k.setAttribute('y',y);k.setAttribute('width',17);k.setAttribute('height',6);k.setAttribute('rx',1.2);g.appendChild(k)}}})();
document.querySelectorAll('.fimg').forEach(im=>{const n=DATA.flags[im.dataset.f],c=['assets/flags/'+n,n];let k=0;const t=()=>{if(k<c.length)im.setAttribute('href',c[k++])};im.addEventListener('error',t);t()});
const st=$('#stage');st.scrollLeft=(st.scrollWidth-st.clientWidth)/2;
$('#hint').textContent=matchMedia('(pointer:coarse)').matches?'Kaydırarak odada dolaş, objelere dokun.':'Objelere tıkla. Bazıları bir şey saklıyor.';
setTimeout(()=>$('#hint').style.opacity=0,12000);
if(matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches)addEventListener('pointermove',e=>{room.style.setProperty('--px',(e.clientX/innerWidth*2-1).toFixed(2));room.style.setProperty('--py',(e.clientY/innerHeight*2-1).toFixed(2))});
function enter(){$('#intro').classList.add('out');document.body.classList.remove('dark');S.set('firstVisit',false);if(ambOn)ac()}
if(S.get('firstVisit',true)){$('#go').onclick=enter}
else{$('#intro').remove();document.body.classList.remove('dark');setTimeout(()=>toast('Tekrar geldin.'),1400);
if(ambOn)addEventListener('pointerdown',()=>ac(),{once:true})}
</script>
</body>
</html>
