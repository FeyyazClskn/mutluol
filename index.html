<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>İnteraktif Oda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="scene-shell" aria-label="İnteraktif oda sahnesi">
      <div class="scene" id="scene">
        <img id="roomImage" class="room-image" src="room.jpg" alt="İnteraktif oda" draggable="false">

        <button class="hotspot" id="mirrorHotspot" type="button" aria-label="Aynayı etkileştir"></button>
        <button class="hotspot" id="notebookHotspot" type="button" aria-label="Not defterini aç"></button>



        <div class="mirror-effect" id="mirrorEffect" aria-hidden="true">
          <div class="mirror-flash"></div>
          <svg class="crack-svg" viewBox="0 0 100 240" preserveAspectRatio="none">
            <g class="crack-main">
              <path d="M49 122 L43 105 L44 87 L37 69 L40 53 L33 35" />
              <path d="M50 122 L57 104 L56 87 L64 70 L61 54 L69 37 L66 21" />
              <path d="M50 122 L34 118 L22 107 L9 110" />
              <path d="M50 122 L67 128 L79 140 L94 142" />
              <path d="M50 122 L43 139 L35 155 L37 173 L29 196 L31 216" />
              <path d="M50 122 L59 140 L66 157 L64 175 L72 195 L69 216" />
              <path d="M43 105 L30 96 L19 82" />
              <path d="M57 104 L71 95 L83 80" />
              <path d="M34 118 L23 127 L16 141" />
              <path d="M67 128 L78 119 L87 107" />
            </g>
            <g class="crack-glint">
              <path d="M49 122 L43 105 L44 87 L37 69" />
              <path d="M50 122 L57 104 L56 87 L64 70" />
            </g>
            <circle class="impact" cx="50" cy="122" r="2.4" />
          </svg>
        </div>
      </div>
    </section>
  </main>

  <div class="mirror-message" id="mirrorMessage" aria-live="polite" role="status">
    <div class="mirror-message-card">Ayna güzelliğinin karşısında dayanamayıp kırıldı.</div>
  </div>

  <section class="modal-backdrop" id="notebookModal" aria-hidden="true">
    <div class="notebook-panel" role="dialog" aria-modal="true" aria-labelledby="notebookTitle">
      <button class="modal-close" id="closeNotebook" type="button" aria-label="Kapat">×</button>
      <header class="notebook-header">
        <span class="eyebrow">PERSONAL NOTES</span>
        <h2 id="notebookTitle">Not Defteri</h2>
      </header>
      <div class="notes-list" id="notesList"></div>
      <form class="add-note" id="addNoteForm">
        <label for="newNote">Yeni not</label>
        <textarea id="newNote" maxlength="240" rows="3" placeholder="Bir şeyler yaz..."></textarea>
        <div class="add-note-row">
          <span id="noteCounter">0 / 240</span>
          <button class="add-button" type="submit">Not Ekle</button>
        </div>
      </form>
    </div>
  </section>

  <script src="js/main.js" defer></script>
  <script src="js/interactions.js" defer></script>
  <script src="js/notebook.js" defer></script>
</body>
</html>
